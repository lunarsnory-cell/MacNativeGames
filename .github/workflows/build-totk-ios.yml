name: Build TOTK v1.4.3 iOS (.ipa)

on:
  workflow_dispatch:

jobs:
  build-totk-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build & Conversion Dependencies
        run: |
          brew install xcodegen cmake ninja opus libvpx python@3.14 megatools dotnet-sdk
          dotnet tool install -g hactoolnet

      - name: Set up Rust iOS Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Inject Prod Keys
        run: |
          mkdir -p ~/.switch
          echo "${{ secrets.PROD_KEYS }}" > prod.keys
          cp prod.keys ~/.switch/prod.keys
          cp prod.keys ~/.switch/keys.txt

      - name: Download Game Files & Firmware from MEGA.nz
        run: |
          # Download base game, update, and firmware using megatools
          megadl '${{ secrets.MEGA_BASE_URL }}' --path base.nsp
          megadl '${{ secrets.MEGA_UPDATE_URL }}' --path update.nsp
          megadl '${{ secrets.MEGA_FIRMWARE_URL }}' --path firmware.zip
          
          # Extract the system firmware NCAs
          unzip -q firmware.zip -d firmware/

      - name: Convert Game Dumps to Standard AES-CTR ExeFS
        run: |
          # Ensure hactoolnet path is available
          export PATH="$HOME/.dotnet/tools:$PATH"
          
          # Convert/Re-pack base and update if they contain Type 4 ExeFS encryption
          echo "Processing base.nsp and update.nsp with hactoolnet..."
          hactoolnet -k ~/.switch/prod.keys -t nsp base.nsp --outdir base_extracted/ || true
          hactoolnet -k ~/.switch/prod.keys -t nsp update.nsp --outdir update_extracted/ || true

      - name: Run TOTK 1.4.3 Native iOS Build Pipeline
        run: |
          python3.14 build_app.py base.nsp \
            -k prod.keys \
            --update update.nsp \
            --firmware firmware/ \
            --platform ios \
            -o TOTK.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOTK-v1.4.3-iOS-IPA
          path: "**/*.ipa"
